name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  archive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ARCHIVE: swiss-developers-knife-${{ github.ref_name }}.tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Archive dist
        run: tar -czf "$ARCHIVE" -C dist .

      - name: Create GitHub release with dist archive
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.ARCHIVE }}

  image:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      tags: ${{ github.ref_name }} latest
